<VirtualHost *:80>
    DocumentRoot ${APP_DOCUMENT_ROOT}
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    # Archivos ocultos, volcados y metadatos de composer. .well-known (RFC 8615: security.txt, OIDC,
    # assetlinks.json…) llega a la aplicación; el desafío ACME lo atiende Nginx y nunca llega aquí.
    # Con rutas inexistentes, Apache evalúa el primer componente que falta (".well-known").
    <FilesMatch "(^\.(?!well-known$)|\.(sql|bak|log|ini)$|^composer\.(json|lock)$)">
        Require all denied
    </FilesMatch>
    # FilesMatch solo mira el nombre del archivo: el contenido de un directorio oculto (.git/config) se
    # niega aquí, salvo .well-known/.
    <DirectoryMatch "/\.(?!well-known(/|$))">
        Require all denied
    </DirectoryMatch>
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
